name: Build and Deploy Windows App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Build Windows Executable & Installer
        shell: pwsh
        run: |
          $signKey = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          $signPass = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          if ($signKey -and $signKey.Trim() -ne "") {
            Write-Host "Signing key detected. Building signed Windows installer..."
            $env:TAURI_SIGNING_PRIVATE_KEY = $signKey
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $signPass
            npx tauri build --ci --bundles nsis
          } else {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY secret detected. Building unsigned Windows installer (--no-sign)..."
            npx tauri build --ci --bundles nsis --no-sign
          }

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirverData-Windows-Setup
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Attach Installers to GitHub Release (on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/bundle/nsis/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

