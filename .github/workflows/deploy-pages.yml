name: Deploy web app to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish sirverchats-3.9
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The production gateway is now healthy and provides the single
      # authenticated bootstrap/message read path. Keep the URL explicit so a
      # Pages build cannot accidentally fall back to a stale preview host.
      VITE_ENABLE_API_V2_BOOTSTRAP: 'true'
      VITE_API_V2_URL: https://chat.sirverdata.top/api/v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build production web app
        run: npm run build

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sirverchats

      - name: Verify production hostname
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            html="$(curl --retry 3 --retry-all-errors -fsS https://app.sirverdata.top/ || true)"
            if printf '%s' "${html}" | grep -q 'assets/index-'; then
              echo 'app.sirverdata.top is serving the production web app'
              exit 0
            fi
            sleep 10
          done
          echo 'app.sirverdata.top did not become ready' >&2
          exit 1
