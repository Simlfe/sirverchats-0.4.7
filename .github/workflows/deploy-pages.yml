name: Deploy web app to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      enable_api_v2:
        description: Enable the API v2 bootstrap after a canary has passed
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    name: Build and publish sirverchats-3.9
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The production gateway is now healthy and provides the single
      # authenticated bootstrap/message read path. Keep the URL explicit so a
      # Pages build cannot accidentally fall back to a stale preview host.
      VITE_ENABLE_API_V2_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_api_v2 || false }}
      VITE_API_V2_URL: https://chat.sirverdata.top/api/v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Typecheck
        run: npm run lint

      - name: Build production web app
        run: npm run build

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sirverchats

      - name: Verify production hostname
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            html="$(curl --retry 3 --retry-all-errors -fsS https://app.sirverdata.top/ || true)"
            release="$(curl --retry 3 --retry-all-errors -fsS https://app.sirverdata.top/release.json || true)"
            if printf '%s' "${html}" | grep -q 'assets/index-' && printf '%s' "${release}" | grep -q "${GITHUB_SHA}"; then
              echo 'app.sirverdata.top is serving this exact production release'
              exit 0
            fi
            sleep 10
          done
          echo 'app.sirverdata.top did not become ready' >&2
          exit 1
