name: Deploy landing site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Publish sirverdata.top landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load deployment key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LANDING_SSH_KEY }}

      - name: Trust landing host
        env:
          LANDING_HOST: ${{ secrets.LANDING_SSH_HOST }}
          LANDING_PORT: ${{ secrets.LANDING_SSH_PORT }}
        run: ssh-keyscan -p "$LANDING_PORT" -H "$LANDING_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Publish static landing files
        env:
          LANDING_HOST: ${{ secrets.LANDING_SSH_HOST }}
          LANDING_PORT: ${{ secrets.LANDING_SSH_PORT }}
          LANDING_USER: ${{ secrets.LANDING_SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude 'downloads/' \
            landing/ "${LANDING_USER}@${LANDING_HOST}:/var/www/html/"

      - name: Verify landing hostname
        run: curl --fail --retry 3 --retry-all-errors https://sirverdata.top/
