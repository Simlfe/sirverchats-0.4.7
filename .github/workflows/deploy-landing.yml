name: Deploy landing site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Publish sirverdata.top landing page
    runs-on: [self-hosted, linux, landing]
    steps:
      - uses: actions/checkout@v4

      - name: Publish static landing files locally
        run: |
          sudo mkdir -p /var/www/html
          sudo rsync -az --delete \
            --exclude 'downloads/' \
            landing/ /var/www/html/

      - name: Verify landing hostname
        run: curl --fail --retry 3 --retry-all-errors https://sirverdata.top/
