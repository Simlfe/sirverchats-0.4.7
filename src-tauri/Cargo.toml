[package]
name = "sirverdata"
version = "1.0.1"
description = "SirverData Desktop Application"
authors = ["SirverData"]
edition = "2021"

[lib]
name = "sirverdata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# These plugins are used only by the desktop self-updater/window controls.
# Keeping them target-specific prevents the Android Tauri binary from
# carrying desktop update/process code or initialising those plugins.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
