<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password - Sirver</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      max-width: 560px;
      margin: 40px auto;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 16px;
    }
    .logo {
      width: 40px;
      height: 40px;
      background-color: #7bae37;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 20px;
      font-family: monospace;
      text-decoration: none;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-top: 0;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #8b949e;
      margin-bottom: 24px;
    }
    .btn-container {
      margin: 32px 0;
      text-align: center;
    }
    .btn {
      display: inline-block;
      background-color: #7bae37;
      color: #000000;
      font-weight: 800;
      font-size: 14px;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(123, 174, 55, 0.3);
      transition: all 0.2s ease;
    }
    .footer {
      border-top: 1px solid #30363d;
      padding-top: 20px;
      margin-top: 32px;
      font-size: 12px;
      color: #6e7681;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">S</div>
      <span class="brand-name">SIRVER</span>
    </div>

    <h1>Reset your password</h1>

    <p>We received a request to reset your Sirver password.</p>
    <p>If you requested this change, press the button below.</p>

    <div class="btn-container">
      <a href="https://sirverdata.top/reset-password?token={TOKEN}" class="btn" target="_blank">Reset Password</a>
    </div>

    <div class="footer">
      <p>If you didn't request this, you can safely ignore this email.</p>
      <p>This link expires automatically.</p>
    </div>
  </div>
</body>
</html>
