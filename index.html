<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#151a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="SirverData is a fast community chat app with text and low-latency voice." />
    <meta property="og:title" content="SirverData — Community chat and voice" />
    <meta property="og:description" content="SirverData is a fast community chat app with text and low-latency voice." />
    <link rel="canonical" href="https://app.sirverdata.top/" />
    <link rel="icon" type="image/png" href="/sirverdata-icon.png" />
    <link rel="apple-touch-icon" href="/sirverdata-icon.png" />
    <title>SirverData — Community chat and voice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Paint a tiny, dependency-free shell while the React bundle is being
         fetched. React replaces this node on its first render; if a script or
         network request fails, the user still gets an actionable status rather
         than a white page. */
      #startup-shell {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #dfe8d1;
        background: #151a12;
        font-family: Inter, system-ui, sans-serif;
      }
      #startup-shell > div { width: min(360px, 100%); }
      #startup-shell .startup-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .01em; }
      #startup-shell .startup-dot { width: 12px; height: 12px; border-radius: 999px; background: #7bae37; box-shadow: 0 0 0 5px rgba(123,174,55,.15); }
      #startup-shell .startup-line { height: 10px; margin-top: 18px; border-radius: 999px; background: rgba(223,232,209,.13); overflow: hidden; }
      #startup-shell .startup-line::after { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: #7bae37; animation: startup-progress 1.25s ease-in-out infinite; }
      #startup-shell .startup-copy { margin-top: 10px; color: rgba(223,232,209,.62); font-size: 12px; }
      @keyframes startup-progress { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #startup-shell .startup-line::after { animation: none; width: 65%; } }
    </style>
    <script>
      (function() {
        try {
          var mode = 'dark';
          var useThemes = false;
          var userSettings = localStorage.getItem('sirver_user_settings_cache_v2');
          if (userSettings) {
            var parsed = JSON.parse(userSettings);
            if (parsed && parsed.appearance) {
              if (parsed.appearance.theme === 'light') mode = 'light';
              else if (parsed.appearance.theme === 'dark') mode = 'dark';
              else if (parsed.appearance.theme === 'system') {
                mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
              }
              if (typeof parsed.appearance.useThemes === 'boolean') {
                useThemes = parsed.appearance.useThemes;
              }
            }
          } else {
            var savedMode = localStorage.getItem('sirver_theme_mode');
            if (savedMode === 'light' || savedMode === 'dark') mode = savedMode;
            var savedUseThemes = localStorage.getItem('sirver_use_themes_enabled');
            if (savedUseThemes === 'true') useThemes = true;
          }

          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(mode);
          root.setAttribute('data-theme-mode', mode);
          root.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="startup-shell" role="status" aria-live="polite">
        <div>
          <div class="startup-brand"><span class="startup-dot" aria-hidden="true"></span><span>SirverData</span></div>
          <div class="startup-line" aria-hidden="true"></div>
          <div class="startup-copy">Preparing your workspace…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
